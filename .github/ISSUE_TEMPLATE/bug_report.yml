name: 🐛 Bug Report
description: Report a defect, error, or unexpected behavior in LienGuard.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and improve LienGuard!
  - type: input
    id: version
    attributes:
      label: LienGuard Version
      placeholder: "e.g., v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: User Role Encountering Bug
      options:
        - Citizen
        - Bank
        - Authority
        - Administrator
        - Unauthenticated / Guest
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Log in as 'Citizen'
        2. Go to '/cases'
        3. Click on 'New Case'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any browser console errors or server logs.
      render: shell
