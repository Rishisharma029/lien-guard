name: 💡 Feature Request
description: Propose a new capability, workflow, or architectural enhancement for LienGuard.
title: "[FEAT]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea to make LienGuard better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or user pain point.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: target_role
    attributes:
      label: Applicable Stakeholder Scope
      options:
        - All Roles
        - Citizen Workflows
        - Banking & Portfolio Monitoring
        - Legal & Authority Verification
        - System Governance & Administration
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds considered.
